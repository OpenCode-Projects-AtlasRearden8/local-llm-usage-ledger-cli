[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-usage-ledger"
version = "0.1.0"
description = "A Python CLI that keeps an honest ledger of your local-AI usage: wraps OpenAI-compatible endpoints (like Ollama), logs every request to JSONL, and reports monthly summaries, per-model totals, and trend charts."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["local-ai", "ollama", "llm", "usage", "ledger", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
usageledger = "usageledger.cli:main"

[project.urls]
Homepage = "https://dylanasdale.github.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
